app:
  title: Liftr host fixture
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listeningAddress: 127.0.0.1:7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest: {}

liftr:
  # Insecure development composition against literal loopback only; the
  # fixture never targets remote Liftr instances.
  baseUrl: http://127.0.0.1:18080
  auth:
    mode: insecure-development
  ownerDisplay:
    team:
      backstageKind: group
      namespace: default
