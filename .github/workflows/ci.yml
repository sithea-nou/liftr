name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: liftr
          POSTGRES_DB: liftr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LIFTR_TEST_DATABASE_URL: postgres://postgres:liftr@localhost:5432/liftr?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
