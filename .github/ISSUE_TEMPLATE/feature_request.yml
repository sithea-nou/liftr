name: Feature request
description: Propose a focused improvement to Liftr
title: "feature: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and ADRs for related proposals.
          required: true
        - label: The proposal keeps developer-facing Resource contracts provisioner-neutral.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or platform problem should Liftr solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation when possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, constraints, or links to related work.
    validations:
      required: false
