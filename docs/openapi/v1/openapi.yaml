# Liftr Resource API v1 — handwritten contract.
# This document is authoritative for the public v1 HTTP surface and is
# verified against the running router by contract tests; generation from
# internal Go structures is deliberately not used.
openapi: 3.0.3
info:
  title: Liftr Resource API
  version: "1.0"
  description: |
    Provisioner-neutral resource lifecycle control plane.

    Authentication: every /v1 endpoint requires a bearer credential — an
    RFC 9068 JWT access token (typ at+jwt) issued by the configured issuer,
    carrying the Liftr API audience. Credential failures answer 401 with one
    identical Problem body; failure reasons are never disclosed. Health and
    readiness endpoints stay unauthenticated.

    Authorization: actions are authorized against Resource ownership. A
    create requires permission under the requested owner; reads, updates, and
    deletes require permission under the stored owner; Operations authorize
    through their owning Resource; ResourceType discovery is readable by every
    authenticated principal. Forbidden Resource access is externally
    indistinguishable from absence (404) so existence, generation, state, and
    outputs are never disclosed to unauthorized callers; forbidden creates
    answer 403 FORBIDDEN.

    Idempotency keys are scoped per authenticated principal: two principals
    may use the same key independently, and possessing another principal's
    key never grants access to its recorded result.

    Mutations are asynchronous admissions. POST creates a Resource and
    returns 201 immediately; PUT and DELETE return 202 while infrastructure
    work proceeds out of band. Clients monitor lifecycle progress through
    Operations. Operation history is scoped to one Resource; v1 has no global
    Operation list.

    Concurrency: PUT, DELETE, and explicit Operation retry require a concrete
    unsigned 64-bit If-Liftr-Generation precondition. Wildcard semantics do
    not exist in v1; a missing header is answered with 428
    PRECONDITION_REQUIRED and any non-uint64 value is invalid.

    Tombstones: a retained Deleted Resource is returned with status.state
    "Deleted". A 404 means Liftr holds no readable record for the ID.
    Recreation under a used ID is refused with 409 RESOURCE_ALREADY_EXISTS;
    tombstone resurrection is not supported.

    Discovery: GET /v1/resource-types lists registered developer contracts as
    summaries; GET /v1/resource-types/{name}/{version} returns one contract
    including its embedded spec schema and, when the type declares realized
    values, its outputContract. Capabilities in discovery describe the
    ResourceType contract itself; they are not guarantees about current
    backend availability or provisioner selection. The "observe" capability is
    contract metadata only; v1 defines no developer-facing observe endpoint.

    Outputs: a Resource representation may carry an optional "outputs" object.
    It contains "observedGeneration" — the desired generation whose successful
    reconciliation produced the values — and flat non-secret scalar "values"
    whose exact names and types are declared by that ResourceType's
    outputContract. Outputs are absent until first published, are omitted
    from Deleted tombstones, and follow Resource read authorization.
    Outputs are reconciliation snapshots, never live health observations.

    Errors follow RFC 9457 Problem Details (application/problem+json) with
    the Liftr extensions "code", "requestId", and narrow fields such as
    "currentGeneration". RESOURCE_SPEC_INVALID problems additionally carry
    sanitized "violations" entries (path/keyword/message) and a "truncated"
    indicator when more than ten violations exist.

    Caching and representation validators are deferred: responses carry no
    representation validator, so clients must treat ResourceStatus and
    Operation state as mutable and must not cache versioned responses.
security:
  - bearerAuth: []
paths:
  /v1/resource-types:
    get:
      operationId: listResourceTypes
      summary: List discoverable ResourceType contracts
      description: |
        Returns every registered ResourceType as a summary, ordered
        deterministically by name ascending, then version ascending.
        Summaries never embed the spec schema; fetch the detail endpoint for
        it. No pagination exists in v1 because the catalog is small and the
        order is total.
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "200":
          description: The deterministic list of ResourceType summaries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTypeList"
              example:
                items:
                  - name: PostgreSQLDatabase
                    version: v1
                    displayName: PostgreSQL Database
                    description: A managed PostgreSQL database requested through a provisioner-neutral contract.
                    capabilities: [create, delete, observe, update]
                    href: /v1/resource-types/PostgreSQLDatabase/v1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/resource-types/{name}/{version}:
    parameters:
      - $ref: "#/components/parameters/ResourceTypeName"
      - $ref: "#/components/parameters/ResourceTypeVersion"
    get:
      operationId: getResourceType
      summary: Read one ResourceType contract with its spec schema
      description: |
        Returns one developer contract including its embedded "specSchema".
        The schema document follows JSON Schema draft 2020-12; this API models
        only its envelope and does not own the schema keywords. The "$id" URN
        identifies the schema and is never fetched by Liftr or clients.
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "200":
          description: The detailed ResourceType representation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "404":
          $ref: "#/components/responses/ResourceTypeNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/resources:
    post:
      operationId: createResource
      summary: Admit an asynchronous resource create request
      description: |
        Returns 201 Created with the Resource URL in Location and the
        original lifecycle Operation in a Link rel="monitor" header. The
        first accepted response and a later idempotent replay share this
        shape; replays add Idempotency-Replayed: true and report the current
        Resource snapshot in the body.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: |
            Create admitted. On an idempotent replay of the original request
            the status stays 201 and the Idempotency-Replayed header is true.
          headers:
            Location:
              $ref: "#/components/headers/LocationResource"
            Link:
              $ref: "#/components/headers/LinkMonitor"
            Liftr-Generation:
              $ref: "#/components/headers/LiftrGeneration"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            RESOURCE_ALREADY_EXISTS when a retained record already exists for
            the ID, IDEMPOTENCY_CONFLICT when the key was reused with
            different content, OPERATION_ACTIVE when the Resource has an
            active Operation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                resourceAlreadyExists:
                  value:
                    type: https://liftr.dev/problems/resource-already-exists
                    title: Resource already exists
                    status: 409
                    instance: /v1/resources
                    code: RESOURCE_ALREADY_EXISTS
                    requestId: 6f2c7a4c8e5b41d0
                idempotencyConflict:
                  value:
                    type: https://liftr.dev/problems/idempotency-conflict
                    title: Idempotency key conflict
                    status: 409
                    instance: /v1/resources
                    code: IDEMPOTENCY_CONFLICT
                    requestId: 6f2c7a4c8e5b41d0
        "422":
          $ref: "#/components/responses/UnsupportedResourceType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/resources/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getResource
      summary: Read one retained Resource
      description: |
        Returns the Resource with its normalized observed state. A retained
        Deleted tombstone is a normal 200 response whose status.state is
        "Deleted"; 404 means Liftr holds no retained record for this ID.
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "200":
          description: The retained Resource representation.
          headers:
            Liftr-Generation:
              $ref: "#/components/headers/LiftrGeneration"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
    put:
      operationId: updateResource
      summary: Admit an asynchronous spec revision
      description: |
        Requires a concrete If-Liftr-Generation precondition equal to the
        Resource's current generation. Returns 202 Accepted with the new
        lifecycle Operation in Location and Link rel="monitor".
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfLiftrGeneration"
        - $ref: "#/components/parameters/XCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "202":
          description: |
            Update admitted. An idempotent replay keeps 202, identifies the
            original lifecycle Operation in Location and Link, adds
            Idempotency-Replayed: true, and reports the current snapshot.
          headers:
            Location:
              $ref: "#/components/headers/LocationOperation"
            Link:
              $ref: "#/components/headers/LinkMonitor"
            Liftr-Generation:
              $ref: "#/components/headers/LiftrGeneration"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            GENERATION_CONFLICT exposes currentGeneration; also possible are
            IDEMPOTENCY_CONFLICT, OPERATION_ACTIVE, and
            RESOURCE_STATE_CONFLICT.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                generationConflict:
                  value:
                    type: https://liftr.dev/problems/generation-conflict
                    title: Generation conflict
                    status: 409
                    instance: /v1/resources/example
                    code: GENERATION_CONFLICT
                    requestId: 6f2c7a4c8e5b41d0
                    currentGeneration: 7
        "422":
          $ref: "#/components/responses/UnsupportedResourceType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteResource
      summary: Admit an asynchronous delete request
      description: |
        Uses the same concrete If-Liftr-Generation precondition rules as PUT
        and answers with the same 202 semantics. The retained record remains
        readable as a Deleted tombstone after completion.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfLiftrGeneration"
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "202":
          description: Delete admitted; see updateResource for replay semantics.
          headers:
            Location:
              $ref: "#/components/headers/LocationOperation"
            Link:
              $ref: "#/components/headers/LinkMonitor"
            Liftr-Generation:
              $ref: "#/components/headers/LiftrGeneration"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            GENERATION_CONFLICT exposes currentGeneration; also possible are
            IDEMPOTENCY_CONFLICT, OPERATION_ACTIVE, and
            RESOURCE_STATE_CONFLICT.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operations/{id}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getOperation
      summary: Read one lifecycle Operation
      description: |
        Reports lifecycle state without internal execution detail. This
        response does not represent a Resource and therefore carries no
        Liftr-Generation header.
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "200":
          description: The Operation representation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/OperationNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/resources/{id}/operations:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: listResourceOperations
      summary: List one Resource's lifecycle Operation history
      description: |
        Returns newest-first retained Operations for exactly the addressed
        Resource. Authorization uses resource:read against the stored owner;
        absence and denial return the same RESOURCE_NOT_FOUND response.
        Resource existence and authorization are evaluated before limit or
        cursor validation, so malformed pagination input cannot be used as an
        existence oracle. This is the only Operation list in v1; no global
        list exists.

        Pagination is insertion-stable. The cursor is opaque, versioned,
        unsigned, bounded to 64 characters, and bound to this Resource; it is
        neither an authorization token nor a representation of public
        Operation data. Clients must pass it back unchanged. The response
        always contains items, omits nextCursor on the final page, never
        reports a total, and carries no Liftr-Generation header.
      parameters:
        - $ref: "#/components/parameters/OperationPageLimit"
        - $ref: "#/components/parameters/OperationCursor"
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "200":
          description: One insertion-stable page of Resource Operation history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
  /v1/operations/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: retryOperation
      summary: Admit a new Operation retrying one failed Operation
      description: |
        Authorizes ActionResourceRetry (resource:retry) through the source
        Operation's owning Resource. Missing Operations, missing owning
        Resources, and denials return the same OPERATION_NOT_FOUND response.
        This authorization happens before headers or body are validated.

        A successful admission creates a new Operation at the Resource's exact
        current generation and immediately records retryOf provenance. Only a
        latest Failed Operation targeting that same generation is retryable;
        Canceled retry is not supported in v1. The Resource generation does
        not change.

        This operation defines no request body. The runtime accepts an absent
        or whitespace-only body for transport tolerance and rejects any
        non-whitespace content with INVALID_ARGUMENT. The 202 body is the new
        Operation. Replay returns the original child Operation and adds
        Idempotency-Replayed: true. Operation responses carry no
        Liftr-Generation header.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfLiftrGeneration"
        - $ref: "#/components/parameters/XCorrelationId"
      responses:
        "202":
          description: Retry admitted, or the original admission replayed.
          headers:
            Location:
              $ref: "#/components/headers/LocationOperation"
            Link:
              $ref: "#/components/headers/LinkMonitor"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OperationNotFound"
        "409":
          description: |
            GENERATION_CONFLICT (with currentGeneration), IDEMPOTENCY_CONFLICT,
            OPERATION_ACTIVE, or OPERATION_NOT_RETRYABLE.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /healthz:
    get:
      operationId: healthz
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /readyz:
    get:
      operationId: readyz
      summary: Control-plane readiness
      security: []
      description: Reports whether durable state is currently reachable.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "503":
          $ref: "#/components/responses/PersistenceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RFC 9068 JWT access token (typ at+jwt) issued by the configured
        issuer and carrying the Liftr API audience. Liftr verifies tokens;
        it never issues or proxies them.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Retained Resource identifier.
      schema:
        type: string
    OperationId:
      name: id
      in: path
      required: true
      description: Lifecycle Operation identifier.
      schema:
        type: string
    ResourceTypeName:
      name: name
      in: path
      required: true
      description: ResourceType name, addressed as one URL segment.
      schema:
        type: string
    ResourceTypeVersion:
      name: version
      in: path
      required: true
      description: |
        Opaque ResourceType version. A name/version pair identifies one
        immutable contract; breaking and additive schema changes require a new
        version once Resources exist.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key that makes the mutation replayable.
      schema:
        type: string
    IfLiftrGeneration:
      name: If-Liftr-Generation
      in: header
      required: true
      description: |
        Concrete uint64 generation precondition. Wildcards do not exist;
        a missing header yields 428 PRECONDITION_REQUIRED and a malformed
        or non-uint64 value yields 400 INVALID_ARGUMENT.
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709551615
    OperationPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of Operations to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OperationCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque, versioned, unsigned continuation cursor returned by this
        Resource's preceding history page. It is Resource-bound, at most 64
        characters, not an authorization token, and must be passed unchanged.
      schema:
        type: string
        maxLength: 64
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Optional client correlation identifier. It stays strictly separate
        from the authoritative X-Request-ID and is echoed verbatim.
      schema:
        type: string
  headers:
    LiftrGeneration:
      description: |
        Resource.Generation for the Resource represented by this response.
        Emitted only on Resource responses, never on Operation or health
        responses.
      schema:
        type: integer
        minimum: 1
        maximum: 18446744073709551615
    LocationResource:
      description: URL of the created Resource (create requests).
      schema:
        type: string
    LocationOperation:
      description: URL of the lifecycle Operation admitted by this mutation.
      schema:
        type: string
    LinkMonitor:
      description: |
        Web Link pointing at the lifecycle Operation to monitor, always the
        Operation returned by this very request; on a replay it names the
        original Operation even if newer Operations exist.
      schema:
        type: string
        example: </v1/operations/op-123>; rel="monitor"
    IdempotencyReplayed:
      description: True when this response replays an earlier admission.
      schema:
        type: string
        enum: ["true"]
    XRequestId:
      description: Authoritative server-generated request identifier.
      schema:
        type: string
    CacheControlNoStore:
      description: Versioned representations carry no caching metadata.
      schema:
        type: string
        enum: [no-store]
  schemas:
    ResourceTypeRef:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
    OwnerRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
    # ResourceSpec is opaque, ResourceType-defined intent. It stays open-ended
    # by design; only well-formed JSON applies. Integer literals stay integers
    # and decimal or exponent literals stay floats; overflowing integers are
    # rejected.
    ResourceSpec:
      type: object
      additionalProperties: true
    Capability:
      type: string
      description: |
        A developer-facing action supported by a ResourceType contract.
        "observe" is contract metadata only; v1 defines no developer-facing
        observe endpoint.
      enum: [create, update, delete, observe]
    ResourceTypeSummary:
      type: object
      description: |
        Discovery summary of one developer contract. Capabilities are
        ResourceType-contract capabilities; they do not report provisioner
        selection, backend health, or current availability. Provisioner and
        platform concepts have no representation in discovery.
      required: [name, version, displayName, description, capabilities, href]
      properties:
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        href:
          type: string
          description: Relative URL of the detailed contract representation.
    # specSchema embeds a JSON Schema draft 2020-12 document exactly as the
    # ResourceType registered it. The core API models only this envelope;
    # keyword semantics are governed by the JSON Schema specification, which
    # OpenAPI 3.0 Schema Objects deliberately do not mirror here.
    ResourceSpecSchema:
      type: object
      additionalProperties: true
      description: |
        JSON Schema (draft 2020-12) describing the accepted "spec" shape for
        one ResourceType version. Schemas are self-contained; validation never
        performs network resolution. The "$id" URN identifies the schema and
        is never fetched. Structural constraints (types, required properties,
        enums, ranges) apply at admission; unknown properties are rejected.
    ResourceType:
      type: object
      required: [name, version, displayName, description, capabilities, href, specSchema]
      properties:
        name:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        href:
          type: string
        specSchema:
          $ref: "#/components/schemas/ResourceSpecSchema"
        outputContract:
          $ref: "#/components/schemas/ResourceTypeOutputContract"
    SpecViolation:
      type: object
      description: |
        One sanitized spec-contract violation. Paths are RFC 6901 JSON
        Pointers into the submitted spec ("" denotes the root). Violations are
        deterministically ordered and capped at ten entries per response.
      required: [path, keyword, message]
      properties:
        path:
          type: string
        keyword:
          type: string
        message:
          type: string
    ResourceTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeSummary"
    ResourceTypeOutputField:
      type: object
      description: |
        One declared developer-consumable output of a ResourceType version.
        Names are provider-neutral and never echo implementation identifiers;
        secret material has no representation in v1.
      required: [name, jsonType, requiredWhenReady]
      properties:
        name:
          type: string
        jsonType:
          type: string
          description: The exact scalar JSON type of this output value.
          enum: [string, integer, number, boolean]
        requiredWhenReady:
          type: boolean
          description: |
            When true, a successfully reconciled generation must publish this
            field before Liftr reports reconciliation success.
    ResourceTypeOutputContract:
      type: object
      description: |
        The declared non-secret output contract of one ResourceType version.
        It is part of the immutable contract identity; the core API models
        only this envelope, while each contract declares its exact fields.
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeOutputField"
    ResourceOutputs:
      type: object
      description: |
        Realized developer-consumable values of one successfully reconciled
        generation. observedGeneration is an explicit freshness association,
        not a claim of current runtime health; it can lag resource.generation
        while an update is pending or after it failed.
      required: [observedGeneration, values]
      properties:
        observedGeneration:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        values:
          type: object
          description: |
            Flat non-secret scalars whose names and exact types are declared
            by the ResourceType's outputContract. Nested objects, arrays,
            null, and secret material never appear here. Optional contract
            fields are omitted rather than rendered as null.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: integer
              - type: boolean
    Condition:
      type: object
      required: [type, status, reason, observedGeneration, lastTransitionAt]
      properties:
        type:
          type: string
        status:
          type: string
          enum: [True, False, Unknown]
        reason:
          type: string
        message:
          type: string
        observedGeneration:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        lastTransitionAt:
          type: string
          format: date-time
    ResourceStatus:
      type: object
      description: |
        Liftr-owned provider-neutral observation of a Resource.
        observedGeneration tracks evaluated desired generations and does not
        imply successful reconciliation.
      required: [state, observedGeneration, updatedAt]
      properties:
        state:
          type: string
          enum: [Unknown, Pending, Ready, Deleting, Deleted, Failed]
        observedGeneration:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        updatedAt:
          type: string
          format: date-time
    LatestOperationRef:
      type: object
      required: [id, capability, state, targetGeneration, href]
      properties:
        id:
          type: string
        capability:
          type: string
          enum: [create, update, delete]
        state:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Canceled]
        targetGeneration:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        href:
          type: string
    Resource:
      type: object
      required:
        - id
        - type
        - owner
        - generation
        - spec
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ResourceTypeRef"
        owner:
          $ref: "#/components/schemas/OwnerRef"
        generation:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        spec:
          $ref: "#/components/schemas/ResourceSpec"
        status:
          $ref: "#/components/schemas/ResourceStatus"
        latestOperation:
          $ref: "#/components/schemas/LatestOperationRef"
        outputs:
          $ref: "#/components/schemas/ResourceOutputs"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateResourceRequest:
      type: object
      required: [id, type, owner, spec]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Client-chosen identifier, addressable as one URL segment.
        type:
          $ref: "#/components/schemas/ResourceTypeRef"
        owner:
          $ref: "#/components/schemas/OwnerRef"
        spec:
          $ref: "#/components/schemas/ResourceSpec"
    UpdateResourceRequest:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        spec:
          $ref: "#/components/schemas/ResourceSpec"
    OperationFailure:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        message:
          type: string
    Operation:
      type: object
      description: |
        One asynchronous action against a specific desired-state generation.
        Internal execution phases have no public representation in v1.
      required:
        - id
        - resourceId
        - capability
        - state
        - targetGeneration
        - requestedAt
      properties:
        id:
          type: string
        resourceId:
          type: string
        retryOf:
          type: string
          description: Source Operation ID when this Operation is an explicit retry.
        capability:
          type: string
          enum: [create, update, delete]
        state:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Canceled]
        targetGeneration:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        failure:
          $ref: "#/components/schemas/OperationFailure"
    OperationList:
      type: object
      description: |
        One page of newest-first Operations for a single Resource. Internal
        insertion sequence, execution mappings, attempts, and phases have no
        public representation.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        nextCursor:
          type: string
          description: Opaque continuation cursor; absent on the final page.
          maxLength: 64
    Problem:
      type: object
      description: RFC 9457 Problem Details with Liftr extensions.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable Liftr error code.
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - INVALID_ARGUMENT
            - UNSUPPORTED_RESOURCE_TYPE
            - RESOURCE_TYPE_NOT_FOUND
            - RESOURCE_SPEC_INVALID
            - RESOURCE_NOT_FOUND
            - OPERATION_NOT_FOUND
            - OPERATION_NOT_RETRYABLE
            - RESOURCE_ALREADY_EXISTS
            - IDEMPOTENCY_CONFLICT
            - GENERATION_CONFLICT
            - OPERATION_ACTIVE
            - RESOURCE_STATE_CONFLICT
            - UNSUPPORTED_CAPABILITY
            - PRECONDITION_REQUIRED
            - PROVISIONER_UNAVAILABLE
            - PERSISTENCE_UNAVAILABLE
            - INTERNAL
        requestId:
          type: string
        currentGeneration:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
          description: Narrow extension present on GENERATION_CONFLICT problems.
        violations:
          type: array
          description: |
            Present on RESOURCE_SPEC_INVALID problems. Sanitized, deterministically
            ordered spec-contract violations; capped at ten entries.
          items:
            $ref: "#/components/schemas/SpecViolation"
        truncated:
          type: boolean
          description: |
            True when RESOURCE_SPEC_INVALID had more violations than the
            response carries; absent otherwise.
  responses:
    Unauthorized:
      description: |
        UNAUTHENTICATED; no usable credential was presented or the presented
        credential failed verification. The body is identical in every case.
        WWW-Authenticate carries error="invalid_token" only when a credential
        was presented.
      headers:
        WWW-Authenticate:
          description: Bearer challenge; see RFC 6750.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://liftr.dev/problems/unauthenticated
            title: Unauthenticated
            status: 401
            detail: valid bearer credentials are required
            code: UNAUTHENTICATED
            requestId: 6f2c7a4c8e5b41d0
    Forbidden:
      description: |
        FORBIDDEN; the authenticated principal is not authorized. Resource
        reads, updates, and deletes render the same 404 as absent records
        instead, so this status is reserved for create admissions and
        discovery policy denials that hide nothing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: INVALID_ARGUMENT; includes missing Idempotency-Key and malformed preconditions.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ResourceNotFound:
      description: |
        RESOURCE_NOT_FOUND; no retained record exists for this ID or access is
        denied. These cases are intentionally indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OperationNotFound:
      description: |
        OPERATION_NOT_FOUND; no retained Operation exists for this ID, its
        owning Resource is unavailable, or access is denied. These cases are
        intentionally indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://liftr.dev/problems/operation-not-found
            title: Operation not found
            status: 404
            instance: /v1/operations/op-example
            code: OPERATION_NOT_FOUND
            requestId: 6f2c7a4c8e5b41d0
    ResourceTypeNotFound:
      description: RESOURCE_TYPE_NOT_FOUND; no contract is registered with this name and version.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://liftr.dev/problems/resource-type-not-found
            title: Resource type not found
            status: 404
            instance: /v1/resource-types/NoDatabase/v1
            code: RESOURCE_TYPE_NOT_FOUND
            requestId: 6f2c7a4c8e5b41d0
    UnsupportedResourceType:
      description: UNSUPPORTED_RESOURCE_TYPE.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: PRECONDITION_REQUIRED; a concrete If-Liftr-Generation header is mandatory.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: PROVISIONER_UNAVAILABLE or PERSISTENCE_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PersistenceUnavailable:
      description: PERSISTENCE_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: INTERNAL; unexpected server-side failure without internal detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
